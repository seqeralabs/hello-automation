[project]
name = "hello-automation"
version = "0.1.0"
description = "An example of event-driven bioinformatics workflows using Dagster, Nextflow and Seqera Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.36.4",
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.7.1",
    "seqerakit>=0.5.2",
]

[tool.dagster]
module_name = "hello_automation.definitions"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_automation"]

[tool.mypy]
plugins = ['pydantic.mypy']

[dependency-groups]
dev = [
    "types-boto3>=1.36.4",
]
